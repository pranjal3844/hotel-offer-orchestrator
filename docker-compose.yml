
services:
  # Temporal Server
  temporal:
    image: temporalio/temporal:latest
    ports:
      - "7233:7233"
      - "8233:8233"
    command: server start-dev --ip 0.0.0.0
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Database
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Express API
  api:
    build: .
    image: hotel-offer-orchestrator
    command: npm start
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      HOTEL_TASK_QUEUE: hotel-task-queue
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Temporal Worker
  worker:
    build: .
    image: hotel-offer-orchestrator
    command: npm run worker
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      HOTEL_TASK_QUEUE: hotel-task-queue
      SUPPLIER_API_URL: http://api:3000
    depends_on:
      temporal:
        condition: service_healthy
      api:
        condition: service_started
      redis:
        condition: service_healthy
